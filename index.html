<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Will You Be My Valentine?</title>
<style>
  body {
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #ff9a9e, #fad0c4);
    height: 100vh;
    margin: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }

  .container {
    text-align: center;
    background: white;
    padding: 30px;
    border-radius: 20px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.2);
    width: 350px;
    position: relative;
  }

  img {
    width: 200px;
    border-radius: 15px;
    margin-bottom: 15px;
  }

  h1 {
    color: #ff4d6d;
  }

  .buttons {
    position: relative;
    height: 120px; /* increased height for vertical movement */
    margin-top: 20px;
  }

  button {
    width: 100px;
    height: 45px;
    border-radius: 10px;
    border: none;
    cursor: pointer;
    font-size: 16px;
    position: absolute;
    transition: all 0.05s ease;
  }

  #yesBtn {
    background-color: #ff4d6d;
    color: white;
    left: 0;
    top: 0;
  }

  #noBtn {
    background-color: #ccc;
    color: black;
    right: 0;
    top: 0;
  }

  .envelope {
    display: none;
    margin-top: 20px;
    animation: pop 0.6s ease;
  }

  .letter {
    background: #fff;
    padding: 20px;
    border-radius: 10px;
    border: 2px solid #ff4d6d;
    color: #ff4d6d;
  }

  @keyframes pop {
    0% { transform: scale(0); }
    100% { transform: scale(1); }
  }

  .heart {
    position: absolute;
    color: #ff4d6d;
    animation: floatUp 5s linear forwards;
    opacity: 0.8;
    pointer-events: none;
  }

  @keyframes floatUp {
    0% { transform: translateY(0) scale(1); opacity: 1; }
    100% { transform: translateY(-800px) scale(1.5); opacity: 0; }
  }
</style>
</head>
<body>

<div class="container">
  <img src="catPng.jpg" alt="Cute image">
  <h1>Will you be my Valentine? 💖</h1>

  <div class="buttons">
    <button id="yesBtn">Yes 💘</button>
    <button id="noBtn">No 💔</button>
  </div>

  <div class="envelope" id="envelope">
    <div class="letter">
      💌 Happy Valentine’s Day 💌<br><br>
      Thank you for everything you do for me handsome 💕
      <br>Love,
      <br>Kaiya
    </div>
  </div>
</div>

<script>
const yesBtn = document.getElementById("yesBtn");
const noBtn = document.getElementById("noBtn");
const buttonsDiv = document.querySelector(".buttons");
const envelope = document.getElementById("envelope");

// Truly unpredictable No button
noBtn.addEventListener("mousemove", (e) => {
  const rect = buttonsDiv.getBoundingClientRect();
  const btnWidth = noBtn.offsetWidth;
  const btnHeight = noBtn.offsetHeight;

  const mouseX = e.clientX - rect.left;
  const mouseY = e.clientY - rect.top;

  const btnCenterX = noBtn.offsetLeft + btnWidth / 2;
  const btnCenterY = noBtn.offsetTop + btnHeight / 2;
  const distance = Math.hypot(mouseX - btnCenterX, mouseY - btnCenterY);

  if (distance < 120) { // react when mouse is near
    // Move in a random direction
    let angle = Math.random() * 2 * Math.PI;
    let offset = 120 + Math.random() * 80; // move 120-200px
    let newX = noBtn.offsetLeft + Math.cos(angle) * offset;
    let newY = noBtn.offsetTop + Math.sin(angle) * offset;

    // Keep inside container
    newX = Math.max(0, Math.min(rect.width - btnWidth, newX));
    newY = Math.max(0, Math.min(rect.height - btnHeight, newY));

    noBtn.style.left = newX + "px";
    noBtn.style.top = newY + "px";
  }
});

// Yes button click
yesBtn.addEventListener("click", () => {
  noBtn.remove(); // remove No
  yesBtn.style.left = "50%"; // center Yes
  yesBtn.style.transform = "translateX(-50%)";
  envelope.style.display = "block";
  startHearts();
});

// Hearts animation
function startHearts() {
  setInterval(() => {
    const heart = document.createElement("div");
    heart.className = "heart";
    heart.textContent = "💖";
    heart.style.left = Math.random() * window.innerWidth + "px";
    heart.style.bottom = "0px";
    heart.style.fontSize = Math.random() * 20 + 15 + "px";
    document.body.appendChild(heart);
    setTimeout(() => heart.remove(), 5000);
  }, 300);
}
</script>

</body>
</html>
